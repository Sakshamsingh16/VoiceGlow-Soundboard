
name: Build VoiceGlow APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify project ZIP
        run: |
          test -f VoiceGlowSoundboard-GitHub-APK-Project.zip
          unzip -t VoiceGlowSoundboard-GitHub-APK-Project.zip

      - name: Extract Android project
        run: |
          unzip -q VoiceGlowSoundboard-GitHub-APK-Project.zip
          echo "Project files:"
          ls -la VoiceGlowSoundboard
          test -f VoiceGlowSoundboard/settings.gradle.kts
          test -f VoiceGlowSoundboard/build.gradle.kts
          test -f VoiceGlowSoundboard/app/build.gradle.kts

      - name: Verify JVM target configuration
        run: |
          grep -n 'VERSION_17' VoiceGlowSoundboard/app/build.gradle.kts
          grep -n 'jvmTarget = "17"' VoiceGlowSoundboard/app/build.gradle.kts

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          gradle --no-daemon \
            -p VoiceGlowSoundboard \
            assembleDebug

      - name: Verify APK
        run: |
          test -f VoiceGlowSoundboard/app/build/outputs/apk/debug/app-debug.apk
          ls -lh VoiceGlowSoundboard/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceGlow-debug-apk
          path: VoiceGlowSoundboard/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
